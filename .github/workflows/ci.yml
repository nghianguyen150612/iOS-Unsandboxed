name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  host-validation:
    name: Host validation (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Build host CLI and C17 daemon
        run: make host-build
      - name: Run host help, version, and safe-failure checks
        run: make smoke-test

  ios-cross-compile:
    name: Apple ARM64 iOS cross-compilation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build for iOS 12.0+
        run: make build-ios
